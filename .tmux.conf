################
# Key Bindings #
################
unbind C-b
set -g prefix M-p
bind M-p send-prefix

# bind 3 split-window -h -c '#{pane_current_path}'
# bind 2 split-window -v -c '#{pane_current_path}'
bind k kill-session
bind-key -n C-t new-window -c '#{pane_current_path}' -n ''
bind-key -n C-Tab next-window
# bind-key -n C-w kill-pane
bind-key -n M-n split-window
# bind-key -n M-m split-window -h \; select-layout main-horizontal
bind-key C-s \
  if-shell "(($(tmux display -p '#{session_many_attached}')))" \
    choose-session \
    "run-shell \"tmux choose-session \\\"switch-client -t '%%'; kill-session -t '$(tmux display -p '#S')'\\\"\""
unbind r
bind r source-file ~/.tmux.conf

###########
# Options #
###########
set -s copy-command 'wl-copy'
if-shell "[ -x /usr/bin/fish ]" \
  'set-option -g default-shell "/usr/bin/fish"'
set -g default-terminal "screen-256color"
# set -g pane-border-indicators off
# set -g pane-border-indicators arrows
set -g pane-border-style "fg=color12 dim"
set -g pane-active-border-style "fg=color3"
set -g pane-border-lines simple
set -g pane-border-status bottom
set -g pane-border-format " #{pane_title} "
set -g history-limit 100000

#########
# Hooks #
#########
set-hook -g after-split-window 'selectp -T "\~" ; selectl tiled'
set-hook -g pane-exited "selectl tiled"
set-hook -g after-new-window 'selectp -T "\~"'
set-hook -g after-new-session 'selectp -T "\~"'

##############
# Status Bar #
##############
setw -g status-style fg=gray,bg=default
setw -g status-left ""
# setw -g status-right "[#S]"
setw -g status-right ""
setw -g status-justify centre
setw -g status-position top
setw -g status-right-style "fg=colour11"

setw -g window-status-current-style 'bg=default fg=default bold'
setw -g window-status-current-format ' 🌞 #[fg=color3 bold]#(echo "#{pane_title}" | awk "{print \$1}") '

setw -g window-status-style 'bg=default fg=default'
# setw -g window-status-format ' #{?#{==:#{pane_current_command},bash},💬,}#{?#{==:#{pane_current_command},vim},📝,}#{?#{==:#{pane_current_command},python},🐍,} #[fg=default bold]#{=16:pane_title} '
setw -g window-status-format ' 🌚 #[fg=default bold]#(echo "#{pane_title}" | awk "{print \$1}") '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

setw -g message-style 'bg=default fg=colour3'

# set-option -g status-interval 1
set-option -g automatic-rename off
# set-option -g automatic-rename-format \
    # '#(echo #{pane_current_path}|sed "s/^${HOME//\//\\\/}/~/")'
set -g mouse on
# set -g window-status-current-style bg='#AAAAAA',fg=black

set-option -g set-titles on
set-option -g set-titles-string " "